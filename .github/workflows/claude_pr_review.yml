# This workflow runs Claude Code as an automated PR reviewer.
# Learn more at https://github.com/anthropics/claude-code-action

name: Claude PR Review

on:
  workflow_call:
    inputs:
      model:
        description: Model used for the review.
        required: false
        type: string
        default: claude-sonnet-5
      max_turns:
        description: Maximum number of agent turns to avoid runaway costs.
        required: false
        type: string
        default: "10"
    secrets:
      anthropic_api_key:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  claude_review:
    runs-on: ubuntu-latest
    name: Run Claude review on pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fetch the org-wide review instructions shared with GitHub Copilot code review
      - name: Checkout review instructions
        uses: actions/checkout@v4
        with:
          repository: sbgisen/.github
          path: .sbgisen-github
          # TODO: Remove this ref once feature/claude-pr-review is merged into main.
          ref: feature/claude-pr-review

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          prompt: |
            Your review instructions are in `.sbgisen-github/.github/copilot-instructions.md`.
            Read that file first and follow it strictly, with these adjustments:

            - Marker sentence: write "SBGISEN CLAUDE REVIEW 2026" instead of the one in the file.
            - The coding format files referenced as `.github/instructions/` in the instructions
              are located under `.sbgisen-github/.github/instructions/`.
            - Submit your review as a formal GitHub pull request review, not a plain comment.
              Map your verdict to the review event: APPROVE -> approve,
              COMMENT -> comment, REQUEST_CHANGES -> request changes.
              Use the pull request reviews API via `gh api` so that each finding is posted
              as an inline comment anchored to the file and line, with the PR Overview as
              the review body. Fall back to `gh pr review` if inline anchoring fails.
            - The `.sbgisen-github/` directory is a checkout of the instructions repository,
              not part of this pull request. Never review or mention its contents as findings.
            - If this run was triggered by a review request to a team (check the event payload
              at $GITHUB_EVENT_PATH for `requested_team`), remove that team's review request
              after submitting your review:
              `gh api --method DELETE repos/{owner}/{repo}/pulls/{number}/requested_reviewers -f "team_reviewers[]=<team-slug>"`

            Now review this pull request.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Bash(gh pr review:*),Bash(gh api:*)"
