# This workflow runs Claude Code as an automated PR reviewer.
# Learn more at https://github.com/anthropics/claude-code-action

name: Claude PR Review

on:
  workflow_call:
    inputs:
      model:
        description: Model used for the review.
        required: false
        type: string
        default: claude-sonnet-5
      max_turns:
        description: Maximum number of agent turns to avoid runaway costs.
        required: false
        type: string
        default: "50"
    secrets:
      # anthropic_api_key:
      #   description: Anthropic API key (Console credits). Provide either this or claude_code_oauth_token.
      #   required: true
      claude_code_oauth_token:
        description: OAuth token generated by `claude setup-token` (Pro/Max subscription).
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  # Required to exchange an OIDC token for the Claude GitHub App token.
  id-token: write

jobs:
  claude_review:
    runs-on: ubuntu-latest
    name: Run Claude review on pull request
    timeout-minutes: 15
    # Cancel an in-flight review when a new one starts for the same PR.
    concurrency:
      group: claude-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fetch the org-wide review instructions shared with GitHub Copilot code review
      - name: Checkout review instructions
        uses: actions/checkout@v6
        with:
          repository: sbgisen/.github
          path: .sbgisen-github
          # TODO: Remove this ref once feature/claude-pr-review is merged into main.
          ref: feature/claude-pr-review

      # Pre-compute PR facts so Claude does not spend turns discovering them.
      - name: Get changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | tr '\n' ',')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            CHANGED FILES: ${{ steps.diff.outputs.files }}

            Your review instructions are in `.sbgisen-github/.github/copilot-instructions.md`.
            Read that file first and follow it strictly, with these adjustments:

            - Marker sentence: write "SBGISEN CLAUDE REVIEW 2026" instead of the one in the file.
            - The coding format files referenced as `.github/instructions/` in the instructions
              are located under `.sbgisen-github/.github/instructions/`.
            - Submit everything as ONE formal pull request review, like a human reviewer.
              First write the JSON payload to `review-payload.json` in the workspace root
              using the Write tool (never via shell redirection or heredoc), then run:
              `gh api repos/{owner}/{repo}/pulls/{number}/reviews --input review-payload.json`
              The payload contains the PR Overview as `body`, the verdict as `event`
              (APPROVE / COMMENT / REQUEST_CHANGES), and every finding as an entry in
              `comments[]` anchored to its file and line. Inline comments can only anchor to
              lines that are part of the diff.
            - Run Bash commands one at a time. Never chain commands with `&&`, `;` or pipes;
              chained commands are rejected by the sandbox.
            - If that request fails after one retry, fall back to posting findings individually
              with `mcp__github_inline_comment__create_inline_comment` and submitting the
              verdict with `gh pr review`.
            - The `.sbgisen-github/` directory is a checkout of the instructions repository,
              not part of this pull request. Never review or mention its contents as findings.
            - If this run was triggered by a review request to a team (check the event payload
              at $GITHUB_EVENT_PATH for `requested_team`), remove that team's review request
              after submitting your review: `gh api --method DELETE
              repos/{owner}/{repo}/pulls/{number}/requested_reviewers -f "team_reviewers[]=<team-slug>"`

            Now review this pull request.
          # yamllint disable rule:line-length
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api:*)"
